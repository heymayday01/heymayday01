<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 2" fill="none" width="100%" height="2" preserveAspectRatio="none">
  <defs>
    <!-- Base gradient (static, softer) -->
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#A371F7" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#A371F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </linearGradient>

    <!-- Moving light bar (gentler, slower) -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="divClip">
      <rect width="100" height="2"/>
    </clipPath>
  </defs>

  <!-- Base gradient -->
  <rect width="100" height="2" fill="url(#divGrad)"/>

  <!-- Moving light bar (9s sweep, sine easing — very gentle) -->
  <g clip-path="url(#divClip)">
    <rect x="-30" y="0" width="30" height="2" fill="url(#sweepGrad)">
      <animate attributeName="x" from="-30" to="130" dur="9s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/>
    </rect>
  </g>
</svg>
