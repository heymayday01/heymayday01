<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none" width="1200" height="280">
  <defs>
    <!-- Mesh gradient orbs — softer, more spread -->
    <radialGradient id="orb1" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <!-- Name gradient — white to soft blue -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F6FC"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>

    <!-- Tagline gradient — blue to purple -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>

    <!-- Glow filter for status dot -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="#0D1117"/>

  <!-- Mesh orbs -->
  <rect width="1200" height="280" fill="url(#orb1)"/>
  <rect width="1200" height="280" fill="url(#orb2)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- Status dot (top-center, small) -->
  <g filter="url(#dotGlow)">
    <circle cx="585" cy="68" r="4" fill="#3FB950" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="585" cy="68" r="3" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="72" font-family="JetBrains Mono, monospace" font-size="11" fill="#3FB950" letter-spacing="1">
    available for work
  </text>

  <!-- Name — centered, big, lots of breathing room (fade-in entrance) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.8s" fill="freeze"/>
    <text x="600" y="160" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="68" font-weight="700" fill="url(#nameGrad)"
          text-anchor="middle" letter-spacing="-2.5">
      Aryan Thakare
    </text>
  </g>

  <!-- Tagline — one line, gradient (fade-in after name) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/>
    <text x="600" y="200" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="18" font-weight="400" fill="url(#tagGrad)"
          text-anchor="middle" letter-spacing="0.8">
      Kernel  ·  Full-Stack Web  ·  Applied AI
    </text>
  </g>

  <!-- Subtle location line (fade-in last) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
    <text x="600" y="232" font-family="JetBrains Mono, monospace" font-size="11" fill="#7D8590"
          text-anchor="middle" letter-spacing="0.5">
      India · IST
    </text>
  </g>
</svg>
