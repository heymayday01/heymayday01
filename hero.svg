<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none" width="1200" height="320">
  <defs>
    <!-- ============ BACKGROUND ORBS ============ -->
    <radialGradient id="orbBlue" cx="22%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="78%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="65%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#79C0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#79C0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbMagenta" cx="30%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#BC8CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#BC8CFF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- ============ GLASS ============ -->
    <filter id="frostedGlass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1F26" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#0D1117" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#161B22" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A371F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#79C0FF" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bottomShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>

    <!-- ============ SHIMMER SWEEP (for the name) ============ -->
    <linearGradient id="shimmerSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#79C0FF" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- ============ TEXT GRADIENTS ============ -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F0F6FC"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>

    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>

    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- ============ CLIP PATH FOR SHIMMER (name only) ============ -->
    <clipPath id="nameClip">
      <rect x="0" y="120" width="1200" height="80"/>
    </clipPath>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="1200" height="320" fill="#0D1117"/>

  <!-- ===== DRIFTING ORBS (4 layers, each drifts slowly) ===== -->
  <!-- Orb 1: Blue, top-left, drifts right-up -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 40,-20; 0,0"
                      dur="14s" repeatCount="indefinite"
                      calcMode="spline" keyTimes="0;0.5;1"
                      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect width="1200" height="320" fill="url(#orbBlue)"/>
  </g>
  <!-- Orb 2: Purple, bottom-right, drifts left-down -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; -30,25; 0,0"
                      dur="17s" repeatCount="indefinite"
                      calcMode="spline" keyTimes="0;0.5;1"
                      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect width="1200" height="320" fill="url(#orbPurple)"/>
  </g>
  <!-- Orb 3: Cyan, top-right, drifts in a circle -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 25,15; 0,30; -25,15; 0,0"
                      dur="20s" repeatCount="indefinite"
                      calcMode="spline" keyTimes="0;0.25;0.5;0.75;1"
                      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect width="1200" height="320" fill="url(#orbCyan)"/>
  </g>
  <!-- Orb 4: Magenta, bottom-left, drifts right -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 35,-10; 0,0"
                      dur="16s" repeatCount="indefinite"
                      calcMode="spline" keyTimes="0;0.5;1"
                      keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect width="1200" height="320" fill="url(#orbMagenta)"/>
  </g>

  <!-- Grid -->
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- ============ GLASS CARD ============ -->
  <rect x="42" y="42" width="1116" height="236" rx="18" ry="18" fill="#000000" opacity="0.5" filter="url(#frostedGlass)"/>
  <rect x="40" y="40" width="1120" height="240" rx="18" ry="18" fill="url(#glassFill)"/>
  <rect x="40" y="40" width="1120" height="3" rx="1.5" fill="url(#topHighlight)"/>
  <rect x="40" y="250" width="1120" height="30" rx="0" fill="url(#bottomShadow)" opacity="0.4"/>
  <rect x="40.5" y="40.5" width="1119" height="239" rx="17.5" ry="17.5"
        fill="none" stroke="url(#glassBorder)" stroke-width="1.5"/>
  <rect x="43" y="43" width="1114" height="234" rx="15" ry="15"
        fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- ============ STATUS DOT (breathing) ============ -->
  <g>
    <circle cx="78" cy="92" r="14" fill="#3FB950" opacity="0.2" filter="url(#dotGlow)">
      <animate attributeName="r" values="10;18;10" dur="2.5s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.5s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </circle>
    <circle cx="78" cy="92" r="5" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="96" y="96" font-family="JetBrains Mono, monospace" font-size="11" fill="#3FB950" letter-spacing="1">
    available for work
  </text>

  <!-- Version metadata (top-right) -->
  <text x="1122" y="96" font-family="JetBrains Mono, monospace" font-size="10" fill="#7D8590" text-anchor="end" letter-spacing="0.5" opacity="0.7">
    v2026.07 · build 548974a
  </text>

  <!-- ============ NAME (fade-in + continuous shimmer sweep) ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.8s" fill="freeze"/>
    <!-- Base name -->
    <text x="600" y="180" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="68" font-weight="700" fill="url(#nameGrad)"
          text-anchor="middle" letter-spacing="-2.5">
      Aryan Thakare
    </text>
    <!-- Shimmer sweep overlay (clipped to name area, sweeps left-to-right every 4s) -->
    <g clip-path="url(#nameClip)">
      <rect x="-200" y="120" width="200" height="80" fill="url(#shimmerSweep)" opacity="0.6">
        <animate attributeName="x" from="-200" to="1400" dur="4s" repeatCount="indefinite" begin="1.5s"/>
      </rect>
    </g>
  </g>

  <!-- ============ TAGLINE (fade-in + subtle hue shift) ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/>
    <text x="600" y="218" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="18" font-weight="400" fill="url(#tagGrad)"
          text-anchor="middle" letter-spacing="0.8">
      Kernel  ·  Full-Stack Web  ·  Applied AI
    </text>
  </g>

  <!-- ============ LOCATION (fade-in) ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
    <text x="600" y="248" font-family="JetBrains Mono, monospace" font-size="11" fill="#7D8590"
          text-anchor="middle" letter-spacing="0.5">
      India · IST
    </text>
  </g>
</svg>
