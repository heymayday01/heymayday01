<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none" width="800" height="200">
  <defs>
    <!-- Glow filter for the snake body -->
    <filter id="snakeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow for the head -->
    <filter id="headGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Snake body gradient — purple → blue → green (matches README palette) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0"/>
      <stop offset="15%" stop-color="#A371F7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#3FB950" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3FB950" stop-opacity="1"/>
    </linearGradient>

    <!-- Trail gradient (faded) -->
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Contribution-grid pattern -->
    <pattern id="snakeCells" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" rx="2.5" fill="#161B22"/>
    </pattern>

    <!-- Card border -->
    <linearGradient id="snakeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FB950" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Card header gradient -->
    <linearGradient id="snakeHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FB950" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="800" height="200" fill="#0D1117" rx="12" ry="12"/>
  <rect x="0.5" y="0.5" width="799" height="199" fill="none" stroke="url(#snakeBorder)" stroke-width="1" rx="12" ry="12"/>

  <!-- Header bar -->
  <rect width="800" height="32" fill="url(#snakeHeader)" rx="12" ry="12"/>
  <rect y="31" width="800" height="1" fill="#3FB950" fill-opacity="0.25"/>

  <!-- Title (left) -->
  <text x="20" y="20" font-family="JetBrains Mono, monospace" font-size="11" fill="#3FB950" letter-spacing="1">
    // contribution_snake.svg
  </text>

  <!-- LIVE indicator (right) with pulsing dot -->
  <circle cx="755" cy="16" r="3.5" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="755" cy="16" r="6" fill="#3FB950" opacity="0.3">
    <animate attributeName="r" values="3.5;8;3.5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="780" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#3FB950" text-anchor="end" letter-spacing="1.5" font-weight="600">
    LIVE
  </text>

  <!-- ============ CONTRIBUTION GRID (background) ============ -->
  <rect x="20" y="48" width="760" height="136" fill="url(#snakeCells)" rx="4" ry="4"/>

  <!-- ============ SNAKE (animated, slithering across the grid) ============ -->
  <g>
    <!-- Translate the whole snake across the screen, looping -->
    <animateTransform attributeName="transform" type="translate"
                      values="-320,0; 1120,0"
                      dur="9s" repeatCount="indefinite"/>

    <!-- Faded trail (behind the snake) -->
    <path d="M -320 116 C -290 96, -250 96, -220 116 S -150 136, -120 116 S -50 96, -20 116 S 50 136, 80 116 S 150 96, 180 116 S 250 136, 280 116"
          fill="none" stroke="url(#trailGrad)" stroke-width="9"
          stroke-linecap="round" opacity="0.5">
      <animate attributeName="d"
               values="M -320 116 C -290 96, -250 96, -220 116 S -150 136, -120 116 S -50 96, -20 116 S 50 136, 80 116 S 150 96, 180 116 S 250 136, 280 116;
                       M -320 116 C -290 136, -250 136, -220 116 S -150 96, -120 116 S -50 136, -20 116 S 50 96, 80 116 S 150 136, 180 116 S 250 96, 280 116;
                       M -320 116 C -290 96, -250 96, -220 116 S -150 136, -120 116 S -50 96, -20 116 S 50 136, 80 116 S 150 96, 180 116 S 250 136, 280 116"
               dur="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- Main snake body — wavy path with phase-animated slithering -->
    <path d="M -320 116 C -290 96, -250 96, -220 116 S -150 136, -120 116 S -50 96, -20 116 S 50 136, 80 116 S 150 96, 180 116 S 250 136, 280 116"
          fill="none" stroke="url(#bodyGrad)" stroke-width="7"
          stroke-linecap="round" filter="url(#snakeGlow)">
      <animate attributeName="d"
               values="M -320 116 C -290 96, -250 96, -220 116 S -150 136, -120 116 S -50 96, -20 116 S 50 136, 80 116 S 150 96, 180 116 S 250 136, 280 116;
                       M -320 116 C -290 136, -250 136, -220 116 S -150 96, -120 116 S -50 136, -20 116 S 50 96, 80 116 S 150 136, 180 116 S 250 96, 280 116;
                       M -320 116 C -290 96, -250 96, -220 116 S -150 136, -120 116 S -50 96, -20 116 S 50 136, 80 116 S 150 96, 180 116 S 250 136, 280 116"
               dur="1.2s" repeatCount="indefinite"/>
      <!-- Subtle thickness pulse -->
      <animate attributeName="stroke-width" values="7;8;7" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- Snake head — glowing circle at the front -->
    <circle cx="280" cy="116" r="9" fill="#3FB950" filter="url(#headGlow)">
      <animate attributeName="cy" values="116;100;116;132;116" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Eye (small dark dot on the head) -->
    <circle cx="284" cy="113" r="1.8" fill="#0D1117">
      <animate attributeName="cy" values="113;97;113;129;113" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Forked tongue (flicks in and out) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 6,0; 0,0; 6,0; 0,0"
                        dur="1.2s" repeatCount="indefinite"/>
      <line x1="289" y1="116" x2="296" y2="116" stroke="#FF7B72" stroke-width="1.5" stroke-linecap="round">
        <animate attributeName="opacity" values="0;1;0;1;0" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="296" y1="116" x2="300" y2="113" stroke="#FF7B72" stroke-width="1.2" stroke-linecap="round">
        <animate attributeName="opacity" values="0;1;0;1;0" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="296" y1="116" x2="300" y2="119" stroke="#FF7B72" stroke-width="1.2" stroke-linecap="round">
        <animate attributeName="opacity" values="0;1;0;1;0" dur="1.2s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- ============ FOOTER ============ -->
  <text x="400" y="194" font-family="JetBrains Mono, monospace" font-size="9" fill="#484F58" text-anchor="middle" letter-spacing="0.5">
    // slithering across 52 weeks of contributions
  </text>
</svg>
