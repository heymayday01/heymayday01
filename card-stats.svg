<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" fill="none" width="360" height="240">
  <defs>
    <linearGradient id="statsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="statsHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="numGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="numGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#BC8CFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="240" fill="#0D1117" rx="12" ry="12"/>
  <rect x="0.5" y="0.5" width="359" height="239" fill="none" stroke="url(#statsBorder)" stroke-width="1" rx="12" ry="12"/>

  <!-- Header -->
  <rect width="360" height="32" fill="url(#statsHeader)" rx="12" ry="12"/>
  <rect y="31" width="360" height="1" fill="#A371F7" fill-opacity="0.25"/>
  <text x="180" y="20" font-family="JetBrains Mono, monospace" font-size="11" fill="#7D8590" text-anchor="middle">
    // live_stats.json
  </text>

  <!-- Stat 1: Repos -->
  <text x="60" y="78" font-family="JetBrains Mono, monospace" font-size="10" fill="#7D8590">REPOS</text>
  <text x="60" y="108" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="url(#numGrad1)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    10
  </text>
  <line x1="20" y1="124" x2="160" y2="124" stroke="#30363D" stroke-width="1"/>

  <!-- Stat 2: Followers -->
  <text x="200" y="78" font-family="JetBrains Mono, monospace" font-size="10" fill="#7D8590">FOLLOWERS</text>
  <text x="200" y="108" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="url(#numGrad2)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.35s" fill="freeze"/>
    <animate attributeName="textLength" values="0;24" dur="0.5s" begin="0.35s" fill="freeze"/>
    live
  </text>
  <line x1="180" y1="124" x2="340" y2="124" stroke="#30363D" stroke-width="1"/>

  <!-- Stat 3: Active days -->
  <text x="60" y="148" font-family="JetBrains Mono, monospace" font-size="10" fill="#7D8590">ACTIVE DAYS</text>
  <text x="60" y="178" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="url(#numGrad1)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    21
  </text>
  <line x1="20" y1="194" x2="160" y2="194" stroke="#30363D" stroke-width="1"/>

  <!-- Stat 4: Longest streak -->
  <text x="200" y="148" font-family="JetBrains Mono, monospace" font-size="10" fill="#7D8590">LONGEST STREAK</text>
  <text x="200" y="178" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="url(#numGrad2)">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.65s" fill="freeze"/>
    3d
  </text>

  <!-- Footer -->
  <text x="180" y="222" font-family="JetBrains Mono, monospace" font-size="9" fill="#484F58" text-anchor="middle">
    pulled from public github api
  </text>
</svg>
