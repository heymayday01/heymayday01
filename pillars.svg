<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 340" fill="none" width="1140" height="340">
  <defs>
    <!-- ============ BACKGROUND ORBS (will show through glass) ============ -->
    <radialGradient id="bgOrb1" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgOrb2" cx="50%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgOrb3" cx="85%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#79C0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#79C0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="pillarGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- ============ GLASS FILTERS ============ -->
    <!-- Frosted blur (heavy) -->
    <filter id="cardBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>

    <!-- Drop shadow for the floating cards -->
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Icon glow -->
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- ============ CARD GLASS FILLS ============ -->
    <linearGradient id="glassK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2230" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="glassW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1830" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13243A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.35"/>
    </linearGradient>

    <!-- ============ CARD BORDERS ============ -->
    <linearGradient id="borderK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="borderW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8957E5" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="borderA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79C0FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Top highlight strip (light catching top edge of each card) -->
    <linearGradient id="topHi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ============ BACKGROUND (visible behind glass) ============ -->
  <rect width="1140" height="340" fill="#0D1117"/>
  <rect width="1140" height="340" fill="url(#bgOrb1)"/>
  <rect width="1140" height="340" fill="url(#bgOrb2)"/>
  <rect width="1140" height="340" fill="url(#bgOrb3)"/>
  <rect width="1140" height="340" fill="url(#pillarGrid)"/>

  <!-- ============ CARD 1: KERNEL ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
    <!-- Drop shadow -->
    <rect x="2" y="8" width="360" height="320" rx="14" ry="14" fill="#000000" opacity="0.5" filter="url(#cardBlur)"/>
    <!-- Glass fill -->
    <rect x="0" y="0" width="360" height="320" rx="14" ry="14" fill="url(#glassK)"/>
    <!-- Top highlight -->
    <rect x="0" y="0" width="360" height="3" rx="1.5" fill="url(#topHi)"/>
    <!-- Border (gradient) -->
    <rect x="0.5" y="0.5" width="359" height="319" rx="13.5" ry="13.5" fill="none" stroke="url(#borderK)" stroke-width="1.5"/>
    <!-- Inner highlight (1px inside, glass refraction) -->
    <rect x="3" y="3" width="354" height="314" rx="11" ry="11" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15"/>
    <!-- Top accent line -->
    <rect x="0" y="0" width="360" height="2" rx="1" fill="#58A6FF" opacity="0.8"/>

    <!-- Icon: chip (slow rotation) -->
    <g transform="translate(180, 84)">
      <!-- Breathing glow behind icon -->
      <circle cx="0" cy="0" r="34" fill="#58A6FF" opacity="0.15" filter="url(#iconGlow)">
        <animate attributeName="r" values="30;38;30" dur="3.5s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="opacity" values="0.1;0.25;0.1" dur="3.5s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      </circle>
      <!-- Chip body (slow rotation) -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-8;8;-8" dur="8s" repeatCount="indefinite"
                          calcMode="spline" keyTimes="0;0.5;1"
                          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <rect x="-22" y="-22" width="44" height="44" rx="6" ry="6" fill="none" stroke="#58A6FF" stroke-width="2"/>
        <rect x="-10" y="-10" width="20" height="20" rx="2" ry="2" fill="#58A6FF" opacity="0.3"/>
        <line x1="-22" y1="-12" x2="-30" y2="-12" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="-22" y1="0" x2="-30" y2="0" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="-22" y1="12" x2="-30" y2="12" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="-12" x2="30" y2="-12" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="0" x2="30" y2="0" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="12" x2="30" y2="12" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="-12" y1="-22" x2="-12" y2="-30" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="-22" x2="0" y2="-30" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="-22" x2="12" y2="-30" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="-12" y1="22" x2="-12" y2="30" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="22" x2="0" y2="30" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="22" x2="12" y2="30" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <text x="180" y="170" font-family="JetBrains Mono, monospace" font-size="10" fill="#58A6FF" text-anchor="middle" letter-spacing="2">
      01 · KERNEL
    </text>
    <text x="180" y="208" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3" text-anchor="middle">
      Performance Engineering
    </text>
    <text x="180" y="246" font-family="Inter, sans-serif" font-size="13" fill="#7D8590" text-anchor="middle">
      KernelSU modules, adaptive AI
    </text>
    <text x="180" y="266" font-family="Inter, sans-serif" font-size="13" fill="#7D8590" text-anchor="middle">
      governors, +30% battery life
    </text>
    <text x="180" y="298" font-family="JetBrains Mono, monospace" font-size="10" fill="#58A6FF" text-anchor="middle" opacity="0.8">
      C · C++ · KernelSU · SD888
    </text>
  </g>

  <!-- ============ CARD 2: WEB ============ -->
  <g transform="translate(390, 0)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.6s" fill="freeze"/>
    <!-- Drop shadow -->
    <rect x="2" y="8" width="360" height="320" rx="14" ry="14" fill="#000000" opacity="0.5" filter="url(#cardBlur)"/>
    <!-- Glass fill -->
    <rect x="0" y="0" width="360" height="320" rx="14" ry="14" fill="url(#glassW)"/>
    <!-- Top highlight -->
    <rect x="0" y="0" width="360" height="3" rx="1.5" fill="url(#topHi)"/>
    <!-- Border -->
    <rect x="0.5" y="0.5" width="359" height="319" rx="13.5" ry="13.5" fill="none" stroke="url(#borderW)" stroke-width="1.5"/>
    <!-- Inner highlight -->
    <rect x="3" y="3" width="354" height="314" rx="11" ry="11" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15"/>
    <!-- Top accent line -->
    <rect x="0" y="0" width="360" height="2" rx="1" fill="#A371F7" opacity="0.8"/>

    <!-- Icon: browser window (shimmer sweep on content lines) -->
    <g transform="translate(180, 84)">
      <!-- Breathing glow behind icon -->
      <circle cx="0" cy="0" r="34" fill="#A371F7" opacity="0.15" filter="url(#iconGlow)">
        <animate attributeName="r" values="30;38;30" dur="4s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="opacity" values="0.1;0.25;0.1" dur="4s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      </circle>
      <rect x="-26" y="-20" width="52" height="40" rx="4" ry="4" fill="none" stroke="#A371F7" stroke-width="2"/>
      <line x1="-26" y1="-12" x2="26" y2="-12" stroke="#A371F7" stroke-width="2"/>
      <circle cx="-20" cy="-16" r="1.5" fill="#A371F7"/>
      <circle cx="-15" cy="-16" r="1.5" fill="#A371F7"/>
      <circle cx="-10" cy="-16" r="1.5" fill="#A371F7"/>
      <!-- Content lines (opacity pulse — simulates loading) -->
      <line x1="-18" y1="-4" x2="10" y2="-4" stroke="#A371F7" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
      </line>
      <line x1="-18" y1="4" x2="14" y2="4" stroke="#A371F7" stroke-width="2" stroke-linecap="round" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="-18" y1="12" x2="6" y2="12" stroke="#A371F7" stroke-width="2" stroke-linecap="round" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
      </line>
    </g>

    <text x="180" y="170" font-family="JetBrains Mono, monospace" font-size="10" fill="#A371F7" text-anchor="middle" letter-spacing="2">
      02 · WEB
    </text>
    <text x="180" y="208" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3" text-anchor="middle">
      Full-Stack Production
    </text>
    <text x="180" y="246" font-family="Inter, sans-serif" font-size="13" fill="#7D8590" text-anchor="middle">
      Next.js 16, Prisma, Supabase,
    </text>
    <text x="180" y="266" font-family="Inter, sans-serif" font-size="13" fill="#7D8590" text-anchor="middle">
      FastAPI — shipped to production
    </text>
    <text x="180" y="298" font-family="JetBrains Mono, monospace" font-size="10" fill="#A371F7" text-anchor="middle" opacity="0.8">
      TS · React · Next.js · Postgres
    </text>
  </g>

  <!-- ============ CARD 3: AI ============ -->
  <g transform="translate(780, 0)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.6s" fill="freeze"/>
    <!-- Drop shadow -->
    <rect x="2" y="8" width="360" height="320" rx="14" ry="14" fill="#000000" opacity="0.5" filter="url(#cardBlur)"/>
    <!-- Glass fill -->
    <rect x="0" y="0" width="360" height="320" rx="14" ry="14" fill="url(#glassA)"/>
    <!-- Top highlight -->
    <rect x="0" y="0" width="360" height="3" rx="1.5" fill="url(#topHi)"/>
    <!-- Border -->
    <rect x="0.5" y="0.5" width="359" height="319" rx="13.5" ry="13.5" fill="none" stroke="url(#borderA)" stroke-width="1.5"/>
    <!-- Inner highlight -->
    <rect x="3" y="3" width="354" height="314" rx="11" ry="11" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15"/>
    <!-- Top accent line -->
    <rect x="0" y="0" width="360" height="2" rx="1" fill="#79C0FF" opacity="0.8"/>

    <!-- Icon: neural network (pulsing nodes + flowing connections) -->
    <g transform="translate(180, 84)">
      <!-- Breathing glow behind icon -->
      <circle cx="0" cy="0" r="34" fill="#79C0FF" opacity="0.15" filter="url(#iconGlow)">
        <animate attributeName="r" values="30;38;30" dur="3.8s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <animate attributeName="opacity" values="0.1;0.25;0.1" dur="3.8s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      </circle>
      <!-- Connections (flowing opacity = signal propagation) -->
      <line x1="-22" y1="-14" x2="0" y2="-14" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="-22" y1="-14" x2="0" y2="0" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.1s" repeatCount="indefinite"/>
      </line>
      <line x1="-22" y1="-14" x2="0" y2="14" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="-22" y1="0" x2="0" y2="-14" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </line>
      <line x1="-22" y1="0" x2="0" y2="0" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="-22" y1="0" x2="0" y2="14" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="-22" y1="14" x2="0" y2="-14" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-22" y1="14" x2="0" y2="0" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      </line>
      <line x1="-22" y1="14" x2="0" y2="14" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="-14" x2="22" y2="0" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="22" y2="0" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="14" x2="22" y2="0" stroke="#79C0FF" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" begin="1.1s" repeatCount="indefinite"/>
      </line>
      <!-- Nodes (pulsing) -->
      <circle cx="-22" cy="-14" r="4" fill="#79C0FF">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-22" cy="0" r="4" fill="#79C0FF">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-22" cy="14" r="4" fill="#79C0FF">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-14" r="4" fill="#A371F7">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="4" fill="#A371F7">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="14" r="4" fill="#A371F7">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="22" cy="0" r="4" fill="#79C0FF">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="180" y="170" font-family="JetBrains Mono, monospace" font-size="10" fill="#79C0FF" text-anchor="middle" letter-spacing="2">
      03 · AI
    </text>
    <text x="180" y="208" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#E6EDF3" text-anchor="middle">
      Applied LLM Systems
    </text>
    <text x="180" y="246" font-family="Inter, sans-serif" font-size="13" fill="#7D8590" text-anchor="middle">
      Multi-agent orchestration,
    </text>
    <text x="180" y="266" font-family="Inter, sans-serif" font-size="13" fill="#7D8590" text-anchor="middle">
      autonomous content engines
    </text>
    <text x="180" y="298" font-family="JetBrains Mono, monospace" font-size="10" fill="#79C0FF" text-anchor="middle" opacity="0.8">
      Python · LangGraph · Gemini · RAG
    </text>
  </g>
</svg>
